<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">Museum photo style hanbok mannequins</title>
  <desc id="desc">museum-photo-hanbok display with a black hanbok on a male mannequin and a green jeogori with hot-pink skirt on a female mannequin.</desc>
  <defs>
    <linearGradient id="museum-photo-hanbok" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ddd6ca"/>
      <stop offset=".54" stop-color="#cfc7ba"/>
      <stop offset="1" stop-color="#bdb4a8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c9c0b2"/>
      <stop offset="1" stop-color="#aea397"/>
    </linearGradient>
    <linearGradient id="blackSilk" x1=".18" x2=".86" y1=".04" y2="1">
      <stop offset="0" stop-color="#34323a"/>
      <stop offset=".38" stop-color="#191920"/>
      <stop offset=".72" stop-color="#0b0c11"/>
      <stop offset="1" stop-color="#24222b"/>
    </linearGradient>
    <linearGradient id="greenJeogori" x1=".04" x2=".96" y1="0" y2="1">
      <stop offset="0" stop-color="#c9f05b"/>
      <stop offset=".38" stop-color="#7fd733"/>
      <stop offset=".74" stop-color="#38a824"/>
      <stop offset="1" stop-color="#237c28"/>
    </linearGradient>
    <linearGradient id="pinkChima" x1=".1" x2=".86" y1="0" y2="1">
      <stop offset="0" stop-color="#ff4fbe"/>
      <stop offset=".34" stop-color="#f4159b"/>
      <stop offset=".68" stop-color="#d4077c"/>
      <stop offset="1" stop-color="#8d0753"/>
    </linearGradient>
    <linearGradient id="whiteCloth" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset=".62" stop-color="#ece8df"/>
      <stop offset="1" stop-color="#cfc9bf"/>
    </linearGradient>
    <filter id="photoShadow" x="-24%" y="-24%" width="148%" height="148%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#2c251f" flood-opacity=".2"/>
    </filter>
    <filter id="clothBlur" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation=".35"/>
    </filter>
    <pattern id="subtleSilk" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M-4 18 C12 5 32 5 60 18" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
      <path d="M-4 42 C14 30 34 30 60 42" fill="none" stroke="#000" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="goldMotif" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M45 20 C57 33 57 55 45 68 C33 55 33 33 45 20Z" fill="none" stroke="#c59b45" stroke-width="2" stroke-opacity=".24"/>
      <circle cx="45" cy="45" r="4" fill="#c59b45" fill-opacity=".18"/>
    </pattern>
  </defs>

