<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Faceless mannequins wearing traditional Korean hanbok</title>
  <desc id="desc">Two museum-style white mannequins display a women's red and yellow hanbok and a men's navy hanbok with a gat hat.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ddd5ca"/>
      <stop offset=".55" stop-color="#cfc7ba"/>
      <stop offset="1" stop-color="#b9b1a5"/>
    </linearGradient>
    <linearGradient id="redSkirt" x1=".2" x2=".8" y1="0" y2="1">
      <stop offset="0" stop-color="#ff3d30"/>
      <stop offset=".48" stop-color="#d81722"/>
      <stop offset="1" stop-color="#8f121d"/>
    </linearGradient>
    <linearGradient id="yellowTop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset=".55" stop-color="#dfe58f"/>
      <stop offset="1" stop-color="#b2c96f"/>
    </linearGradient>
    <linearGradient id="navyRobe" x1=".1" x2=".85" y1="0" y2="1">
      <stop offset="0" stop-color="#33306c"/>
      <stop offset=".55" stop-color="#24265a"/>
      <stop offset="1" stop-color="#11142c"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".04"/>
      <stop offset=".5" stop-color="#000" stop-opacity=".2"/>
      <stop offset="1" stop-color="#000" stop-opacity=".04"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2b241d" flood-opacity=".22"/>
    </filter>
    <pattern id="silk" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 18 C10 10 22 10 40 18" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
      <path d="M0 34 C12 26 24 26 40 34" fill="none" stroke="#000" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="850" fill="url(#wall)"/>
  <rect y="710" width="1200" height="140" fill="#c8beb1"/>
  <ellipse cx="390" cy="754" rx="245" ry="34" fill="url(#shadow)"/>
  <ellipse cx="850" cy="754" rx="200" ry="31" fill="url(#shadow)"/>

