<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12284c">
  <title>한국의 전통</title>
  <style>
    :root{--navy:#12284c;--ink:#151923;--paper:#f7f1e5;--panel:#fffaf0;--gold:#c59b45;--red:#9f3b36;--green:#24715f;--muted:#5f6878;--line:rgba(18,40,76,.16)}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}#app{min-height:100svh}.top{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px}.hamb{width:48px;height:44px;border:0;border-radius:10px;background:rgba(255,250,240,.92);display:grid;place-content:center;gap:6px;box-shadow:0 8px 24px rgba(7,15,28,.18)}.hamb span{display:block;width:24px;height:2px;background:var(--ink);border-radius:99px}.lang{display:flex;gap:4px;padding:4px;border:1px solid rgba(255,255,255,.34);border-radius:999px;background:rgba(18,40,76,.68);backdrop-filter:blur(12px)}.lang button{border:0;border-radius:999px;min-width:42px;padding:8px 10px;background:transparent;color:rgba(255,255,255,.78);font-weight:800}.lang .on{background:var(--panel);color:var(--navy)}.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;background:var(--navy)}.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(11,22,42,.18),rgba(11,22,42,.86)),var(--bg);background-size:cover;background-position:center;transform:scale(1.03)}.copy{position:relative;z-index:1;color:white;padding:0 24px 86px}.copy p,.kicker{margin:0 0 10px;color:var(--gold);font-weight:900;font-size:.88rem}.copy h1,.page h1{margin:0;font-size:2.24rem;line-height:1.08;letter-spacing:0}.dots{position:absolute;z-index:1;left:24px;bottom:34px;display:flex;gap:8px}.dots span{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.46)}.dots .on{width:30px;background:var(--panel)}.scrim{position:fixed;inset:0;z-index:30;border:0;background:rgba(5,12,24,.34);display:none}.scrim.show{display:block}.menu{position:fixed;z-index:40;inset:0 auto 0 0;width:min(88vw,380px);padding:24px 18px;background:var(--panel);box-shadow:0 18px 48px rgba(18,40,76,.24);overflow:auto;transform:translateX(-104%);transition:transform .24s ease}.menu.show{transform:translateX(0)}.menuHead{display:flex;justify-content:space-between;gap:16px;padding-bottom:16px;margin-bottom:18px;border-bottom:4px double var(--gold)}.menuHead p{margin:0 0 4px;color:var(--red);font-weight:900}.menuHead h2{margin:0;color:var(--navy);font-size:1.36rem}.close,.back{border:1px solid var(--line);border-radius:8px;background:#efe5d6;padding:9px 12px;font-weight:800}.cards,.grid,.quizList,.answers{display:grid;gap:12px}.card{min-height:112px;border:1px solid var(--line);border-radius:8px;background:white;overflow:hidden;display:grid;grid-template-columns:104px 1fr;text-align:left;box-shadow:0 8px 20px rgba(18,40,76,.1);padding:0}.card img{width:100%;height:100%;object-fit:cover}.card span{display:grid;align-content:center;gap:6px;padding:14px}.card strong{color:var(--navy);font-size:1.1rem}.card small{color:var(--muted);line-height:1.35}.quizCard{grid-template-columns:1fr;background:linear-gradient(135deg,var(--navy),var(--green));color:white}.quizCard strong{color:white}.quizCard small{color:rgba(255,255,255,.78)}.page{min-height:100svh;padding:86px 18px 30px}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;margin:18px 0 22px;box-shadow:0 12px 28px rgba(18,40,76,.14)}.summary{color:var(--muted);line-height:1.72}.info,.vocab,.qbtn,.ans,.feedback{border:1px solid var(--line);border-radius:8px;background:white;box-shadow:0 8px 22px rgba(18,40,76,.08)}.grid,.quizList,.answers{margin:22px 0}.info{padding:18px;border-left:5px solid var(--red)}.info:nth-child(2){border-left-color:#1f5f8b}.info:nth-child(3){border-left-color:var(--green)}.info h2,.vocab h2{margin:0 0 8px;color:var(--navy);font-size:1.1rem}.info p{margin:0;color:var(--muted);line-height:1.56}.vocab{padding:18px;margin:20px 0}.vocab div{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}.mainBtn,.subBtn,.qbtn,.ans{width:100%;min-height:52px;border:1px solid var(--line);border-radius:8px;padding:14px 16px}.mainBtn{background:var(--navy);color:white;text-align:center;font-weight:900}.subBtn{margin-top:10px;background:#efe5d6;font-weight:900}.qbtn{display:grid;gap:4px;text-align:left}.qbtn strong{color:var(--navy)}.ans{text-align:left;background:white}.ans.sel{outline:3px solid var(--gold)}.feedback{padding:16px;color:#1f5f8b;line-height:1.55}.result{display:grid;align-content:center;gap:16px}@media(min-width:720px){body{display:grid;place-items:center}#app{width:min(420px,100%);min-height:100svh;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(18,40,76,.1)}.top,.menu,.scrim{left:calc(50% - min(420px,100%)/2);right:calc(50% - min(420px,100%)/2)}.menu{right:auto;width:min(360px,88vw)}}
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script>
    const img={hanok:'https://commons.wikimedia.org/wiki/Special:FilePath/Bukchon_Hanok_Village.jpg?width=1200',hanbok:'https://commons.wikimedia.org/wiki/Special:FilePath/Hanbok_%28%ED%95%9C%EB%B3%B5%29_%284261102177%29.jpg?width=900',games:'https://commons.wikimedia.org/wiki/Special:FilePath/Yut-nori.jpg?width=1200'};
    const slides=[['hanok',img.hanok,{ko:'자연과 어울리는 한옥',en:'Hanok in harmony with nature'}],['hanbok',img.hanbok,{ko:'색과 선이 아름다운 한복',en:'Hanbok shaped by color and line'}],['games',img.games,{ko:'함께 즐기는 전통놀이',en:'Traditional games played together'}]];
    const sections=[{id:'houses',image:img.hanok,title:{ko:'한국 가옥',en:'Korean Houses'},kicker:{ko:'한옥의 구조와 생활',en:'Hanok, structure, and daily life'},summary:{ko:'한옥은 나무, 흙, 돌, 종이 같은 자연 재료로 지은 한국의 전통 가옥입니다. 계절에 맞게 따뜻함과 시원함을 조절하도록 만들어졌고, 마당과 처마를 통해 자연과 가까이 지내는 삶을 담고 있습니다.',en:'Hanok is a traditional Korean house built with natural materials such as wood, earth, stone, and paper. It was designed to stay warm in winter and cool in summer while staying close to nature.'},cards:[['온돌','Ondol','바닥을 따뜻하게 데우는 한국의 전통 난방 방식입니다.','A traditional heating system that warms the floor.'],['마루','Maru','바람이 잘 통하는 나무 바닥 공간으로 여름을 시원하게 보낼 수 있게 합니다.','An open wooden floor area that helps air flow in summer.'],['자연과의 조화','Harmony with Nature','마당, 처마, 창호를 통해 집 안팎이 자연스럽게 이어집니다.','Hanok connects with nature through courtyards, roof eaves, and paper doors.']],words:[['한옥 Hanok','한국의 전통 가옥','Traditional Korean house'],['온돌 Ondol','바닥 난방 방식','Floor heating system'],['마루 Maru','나무로 만든 열린 바닥 공간','Open wooden floor space']]},{id:'hanbok',image:img.hanbok,title:{ko:'한복',en:'Hanbok'},kicker:{ko:'색, 선, 예절의 옷',en:'Clothing of color, line, and occasion'},summary:{ko:'한복은 한국의 전통 의복입니다. 부드러운 선과 넉넉한 형태가 특징이며, 명절과 결혼식 같은 특별한 날에 자주 입습니다. 색과 모양에는 계절, 나이, 예절의 의미가 담기기도 합니다.',en:'Hanbok is traditional Korean clothing. It is known for soft lines and graceful volume, and it is often worn on holidays, weddings, and ceremonies.'},cards:[['저고리','Jeogori','상체에 입는 한복의 짧은 윗옷입니다.','The short upper garment of hanbok.'],['치마와 바지','Chima and Baji','치마는 긴 스커트, 바지는 넉넉한 하의로 한복의 흐르는 실루엣을 만듭니다.','Chima is the long skirt, and baji are loose trousers.'],['색의 의미','Meaning of Color','한복의 색은 계절, 나이, 행사, 상징과 연결되기도 합니다.','Colors can connect to season, age, ceremony, and symbolism.']],words:[['한복 Hanbok','한국의 전통 의복','Traditional Korean clothing'],['저고리 Jeogori','한복의 윗옷','Upper garment'],['치마 Chima','한복의 긴 치마','Long skirt']]},{id:'games',image:img.games,title:{ko:'전통놀이',en:'Traditional Games'},kicker:{ko:'함께 배우고 즐기는 놀이',en:'Games for learning and gathering'},summary:{ko:'한국의 전통놀이는 가족과 마을 사람들이 함께 즐기던 놀이입니다. 명절, 잔치, 마당에서 쉽게 즐길 수 있었고, 규칙이 간단해 처음 접하는 사람도 따라 하기 좋습니다.',en:'Traditional Korean games were enjoyed by families and communities. Many were played during holidays, festivals, and outdoor gatherings.'},cards:[['윷놀이','Yutnori','윷가락을 던져 말을 움직이는 대표적인 명절 놀이입니다.','A holiday board game played by throwing wooden sticks.'],['제기차기','Jegichagi','제기를 발로 차며 떨어뜨리지 않는 놀이입니다.','A game where players kick a jegi and keep it in the air.'],['투호','Tuho','항아리에 화살을 던져 넣는 전통놀이입니다.','A game where players throw arrows into a jar.']],words:[['윷놀이 Yutnori','윷가락과 말판으로 하는 놀이','Board game using wooden sticks'],['제기차기 Jegichagi','제기를 발로 차는 놀이','Foot-kicking game'],['투호 Tuho','항아리에 화살을 던지는 놀이','Arrow-throwing jar game']]}];
    const quizzes={houses:[['한옥에서 바닥을 따뜻하게 데우는 전통 난방 방식은 무엇인가요?','What is the traditional floor heating system in hanok called?',['온돌','마루','저고리','투호'],['Ondol','Maru','Jeogori','Tuho'],0,'맞아요. 온돌은 바닥을 데워 실내를 따뜻하게 합니다.','Correct. Ondol warms the floor to heat the room.'],['마루의 중요한 역할로 알맞은 것은 무엇인가요?','What is a main role of maru?',['바람이 통하게 하기','화살을 던지기','옷의 윗부분 만들기','놀이 말을 움직이기'],['Helping air flow','Throwing arrows','Making an upper garment','Moving game pieces'],0,'맞아요. 마루는 바람이 잘 통하게 해 여름을 시원하게 합니다.','Correct. Maru helps air flow and keeps the space cool.'],['전통 한옥에 주로 쓰이는 재료가 아닌 것은 무엇인가요?','Which material is not typical for traditional hanok?',['나무','흙','종이','플라스틱'],['Wood','Earth','Paper','Plastic'],3,'맞아요. 한옥은 주로 자연 재료를 사용합니다.','Correct. Hanok mainly uses natural materials.']],hanbok:[['한복의 윗옷은 무엇이라고 하나요?','What is the upper garment of hanbok called?',['저고리','온돌','마루','윷'],['Jeogori','Ondol','Maru','Yut'],0,'맞아요. 저고리는 한복의 윗옷입니다.','Correct. Jeogori is the upper garment of hanbok.'],['한복을 설명하는 특징으로 알맞은 것은 무엇인가요?','Which feature often describes hanbok?',['부드러운 선과 움직임','단단한 금속 구조','바닥 난방','항아리에 화살 넣기'],['Soft lines and movement','A hard metal structure','Floor heating','Throwing arrows into a jar'],0,'맞아요. 한복은 부드러운 선과 넉넉한 움직임이 특징입니다.','Correct. Hanbok is known for soft lines and graceful movement.'],['한복을 자주 입는 날로 알맞은 것은 무엇인가요?','When is hanbok often worn?',['명절과 결혼식','매일 운동할 때','비행기 조종할 때','공사 현장에서'],['Holidays and weddings','Daily exercise','Flying an airplane','At a construction site'],0,'맞아요. 한복은 명절, 결혼식, 의식에서 자주 입습니다.','Correct. Hanbok is often worn for holidays, weddings, and ceremonies.']],games:[['윷가락을 던져 말을 움직이는 놀이는 무엇인가요?','Which game uses wooden sticks to move pieces on a board?',['윷놀이','온돌','저고리','마루'],['Yutnori','Ondol','Jeogori','Maru'],0,'맞아요. 윷놀이는 대표적인 명절 놀이입니다.','Correct. Yutnori is a well-known holiday game.'],['제기를 발로 차며 떨어뜨리지 않는 놀이는 무엇인가요?','Which game is played by kicking a jegi with the foot?',['제기차기','투호','한옥','치마'],['Jegichagi','Tuho','Hanok','Chima'],0,'맞아요. 제기차기는 발로 제기를 차는 놀이입니다.','Correct. Jegichagi is played by kicking a jegi.'],['항아리에 화살을 던져 넣는 전통놀이는 무엇인가요?','Which traditional game uses arrows and a jar?',['투호','윷놀이','온돌','저고리'],['Tuho','Yutnori','Ondol','Jeogori'],0,'맞아요. 투호는 항아리에 화살을 던져 넣는 놀이입니다.','Correct. Tuho is played by throwing arrows into a jar.']]};quizzes.mixed=[quizzes.houses[0],quizzes.hanbok[0],quizzes.games[0],quizzes.houses[1],quizzes.games[2]];
    const t={ko:{title:'한국의 전통',menu:'메뉴',close:'닫기',explore:'둘러보기',menuTitle:'한국 전통문화',quiz:'문화 퀴즈',optional:'원하는 사람만 들어가는 복습 공간',home:'처음으로',review:'퀴즈로 복습하기',keys:'핵심 단어',choose:'퀴즈 선택',result:'결과',next:'다음',again:'다시 풀기',related:'설명 다시 보기',q:{houses:'한국 가옥 퀴즈',hanbok:'한복 퀴즈',games:'전통놀이 퀴즈',mixed:'랜덤 퀴즈'},count:'문항'},en:{title:"korea's Traditions",menu:'Menu',close:'Close',explore:'Explore',menuTitle:'Korean Tradition',quiz:'Culture Quiz',optional:'Optional review and play space',home:'Home',review:'Review with Quiz',keys:'Key Words',choose:'Choose a Quiz',result:'Result',next:'Next',again:'Try Again',related:'Review Section',q:{houses:'Korean Houses Quiz',hanbok:'Hanbok Quiz',games:'Traditional Games Quiz',mixed:'Random Quiz'},count:'questions'}};
    let s={lang:'ko',route:'home',section:null,menu:false,slide:0,quiz:null};const app=document.querySelector('#app');const esc=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');const cp=x=>esc(x[s.lang]||x.ko||x);function top(){return `<div class="top"><button class="hamb" aria-label="${t[s.lang].menu}" onclick="act('menu')"><span></span><span></span><span></span></button><div class="lang"><button class="${s.lang==='ko'?'on':''}" onclick="act('lang','ko')">KR</button><button class="${s.lang==='en'?'on':''}" onclick="act('lang','en')">EN</button></div></div>`}function menu(){return `<aside class="menu ${s.menu?'show':''}"><div class="menuHead"><div><p>${t[s.lang].explore}</p><h2>${t[s.lang].menuTitle}</h2></div><button class="close" onclick="act('close')">${t[s.lang].close}</button></div><nav class="cards">${sections.map(x=>`<button class="card" onclick="act('section','${x.id}')"><img src="${x.image}" alt="${cp(x.title)}"><span><strong>${cp(x.title)}</strong><small>${cp(x.kicker)}</small></span></button>`).join('')}<button class="card quizCard" onclick="act('quiz')"><span><strong>${t[s.lang].quiz}</strong><small>${t[s.lang].optional}</small></span></button></nav></aside><button class="scrim ${s.menu?'show':''}" onclick="act('close')"></button>`}function home(){let x=slides[s.slide%slides.length];return `<section class="hero" style="--bg:url('${x[1]}')">${top()}<div class="copy"><p>${esc(x[2][s.lang])}</p><h1>${t[s.lang].title}</h1></div><div class="dots">${slides.map((_,i)=>`<span class="${i===s.slide?'on':''}"></span>`).join('')}</div></section>`}function section(){let x=sections.find(v=>v.id===s.section)||sections[0];return `<section class="page">${top()}<button class="back" onclick="act('home')">${t[s.lang].home}</button><img class="photo" src="${x.image}" alt="${cp(x.title)}"><p class="kicker">${cp(x.kicker)}</p><h1>${cp(x.title)}</h1><p class="summary">${cp(x.summary)}</p><div class="grid">${x.cards.map(c=>`<article class="info"><h2>${esc(s.lang==='ko'?c[0]:c[1])}</h2><p>${esc(s.lang==='ko'?c[2]:c[3])}</p></article>`).join('')}</div><section class="vocab"><h2>${t[s.lang].keys}</h2>${x.words.map(w=>`<div><strong>${esc(w[0])}</strong><span>${esc(s.lang==='ko'?w[1]:w[2])}</span></div>`).join('')}</section><button class="mainBtn" onclick="act('start','${x.id}')">${t[s.lang].review}</button></section>`}function quizChoose(){let ids=['houses','hanbok','games','mixed'];return `<section class="page">${top()}<button class="back" onclick="act('home')">${t[s.lang].home}</button><p class="kicker">${t[s.lang].quiz}</p><h1>${t[s.lang].choose}</h1><div class="quizList">${ids.map(id=>`<button class="qbtn" onclick="act('start','${id}')"><strong>${t[s.lang].q[id]}</strong><span>${quizzes[id].length} ${t[s.lang].count}</span></button>`).join('')}</div></section>`}function quizPage(){let q=s.quiz,cur=q.items[q.i],answered=q.answers[q.i];if(q.done){let score=q.answers.filter(Boolean).length;return `<section class="page result">${top()}<p class="kicker">${t[s.lang].result}</p><h1>${score} / ${q.items.length}</h1><button class="mainBtn" onclick="act('start','${q.id}')">${t[s.lang].again}</button><button class="subBtn" onclick="act('section','houses')">${t[s.lang].related}</button></section>`}return `<section class="page">${top()}<p class="kicker">${q.i+1} / ${q.items.length}</p><h1>${esc(cur[s.lang==='ko'?0:1])}</h1><div class="answers">${cur[s.lang==='ko'?2:3].map((o,i)=>`<button class="ans ${answered&&answered.pick===i?'sel':''}" onclick="act('answer',${i})">${esc(o)}</button>`).join('')}</div>${answered?`<p class="feedback">${esc(cur[s.lang==='ko'?5:6])}</p><button class="mainBtn" onclick="act('next')">${q.i+1===q.items.length?t[s.lang].result:t[s.lang].next}</button>`:''}</section>`}function render(){app.innerHTML=(s.route==='section'?section():s.route==='quiz'?s.quiz?quizPage():quizChoose():home())+menu()}window.act=(a,b)=>{if(a==='menu')s.menu=true;if(a==='close')s.menu=false;if(a==='lang')s.lang=b;if(a==='home'){s.route='home';s.quiz=null;s.menu=false}if(a==='section'){s.route='section';s.section=b;s.quiz=null;s.menu=false}if(a==='quiz'){s.route='quiz';s.quiz=null;s.menu=false}if(a==='start'){s.route='quiz';s.quiz={id:b,items:quizzes[b],i:0,answers:[],done:false};s.menu=false}if(a==='answer'&&s.quiz&&!s.quiz.answers[s.quiz.i])s.quiz.answers[s.quiz.i]={pick:b,ok:b===s.quiz.items[s.quiz.i][4]};if(a==='next'&&s.quiz){s.quiz.i+1>=s.quiz.items.length?s.quiz.done=true:s.quiz.i++}render()};setInterval(()=>{if(s.route==='home'&&!s.menu){s.slide=(s.slide+1)%slides.length;render()}},4500);render();
  </script>
</body>
</html>
